name: Create and publish Docker image

on:
  push:
    branches:
      - 'master'
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container with docker compose
        run: |
          echo "Starting container with docker compose..."
          docker compose pull
          docker compose up -d
          echo "Waiting for container to be ready..."
          sleep 10

          SECONDS_ELAPSED=0
          HEALTH_CHECK_INTERVAL=5
          TOTAL_DURATION=30

          while [ $SECONDS_ELAPSED -lt $TOTAL_DURATION ]; do
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' immocockpit 2>/dev/null || echo "not_found")
            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' immocockpit 2>/dev/null || echo "not_found")
            echo "[$SECONDS_ELAPSED/$TOTAL_DURATION sec] Container: $CONTAINER_STATUS, Health: $HEALTH_STATUS"

            if [ "$CONTAINER_STATUS" != "running" ]; then
              echo "Container stopped running! Status: $CONTAINER_STATUS"
              docker compose logs immocockpit
              exit 1
            fi

            if [ "$HEALTH_STATUS" = "unhealthy" ]; then
              echo "Container is unhealthy!"
              docker compose logs immocockpit
              docker inspect --format='{{json .State.Health}}' immocockpit | jq
              exit 1
            fi

            if [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "Container is healthy."
              break
            fi

            sleep $HEALTH_CHECK_INTERVAL
            SECONDS_ELAPSED=$((SECONDS_ELAPSED + HEALTH_CHECK_INTERVAL))
          done

          echo "Smoke-testing served content..."
          curl --fail --silent --show-error http://localhost:8090/ > /dev/null
          curl --fail --silent --show-error http://localhost:8090/manifest.json > /dev/null
          curl --fail --silent --show-error http://localhost:8090/sw.js > /dev/null
          echo "OK"

          docker compose down
