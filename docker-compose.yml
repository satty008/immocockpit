services:
  immocockpit:
    container_name: immocockpit
    image: ghcr.io/satty008/immocockpit:latest
    pull_policy: always
    ports:
      - "8090:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 10s
